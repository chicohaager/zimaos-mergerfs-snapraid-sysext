name: build-sysext

# Builds the mergerfs+snapraid sysext for amd64 and arm64, smoke-tests the
# binaries inside a matching-arch container (ldd must say "not a dynamic
# executable" for snapraid; --version must run), and publishes both .raw images
# plus SHA256SUMS as release artifacts.
#
# Pins: mergerfs 2.42.0 (official static tarball), SnapRAID 15.0 (static build).
# Both confirmed present + latest via the GitHub release API on 2026-05-30.

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

# Least privilege: read-only by default; only the publish job is granted write.
# Every `uses:` is pinned to a full commit SHA (tag in the comment);
# tests/check-versions.sh fails on an unpinned action and warns on a newer release.
permissions:
  contents: read

env:
  MERGERFS_VERSION: "2.42.0"
  SNAPRAID_VERSION: "15.0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (cross-arch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Build static snapraid (${{ matrix.arch }})
        working-directory: build
        env:
          DOCKER_CONFIG: ""        # CI runner: use default docker config, not ZimaOS path
        run: ./build-snapraid.sh ${{ matrix.arch }}

      - name: Smoke-test snapraid (static + runnable) in ${{ matrix.platform }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/build/out:/out" debian:bookworm-slim bash -c '
              set -e
              echo "--- ldd (expect: not a dynamic executable) ---"
              ldd /out/snapraid-${{ matrix.arch }} || true
              ldd /out/snapraid-${{ matrix.arch }} 2>&1 | grep -q "not a dynamic executable" \
                || { echo "FAIL: snapraid is not static"; exit 1; }
              /out/snapraid-${{ matrix.arch }} --version
            '

      - name: Version pins (consistent = required; newer upstream = warning)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh tests/check-versions.sh

      - name: Script + unit tests (stubbed, no root)
        run: sh tests/run.sh

      - name: Assemble sysext .raw (${{ matrix.arch }})
        working-directory: build
        run: ./build-sysext.sh ${{ matrix.arch }}

      - name: Check image (gzip, extension-release, scripts the units exec)
        run: sh tests/check-raw.sh build/out/mergerfs-snapraid_${{ matrix.arch }}.raw

      - name: install.sh / uninstall.sh as root in a throwaway container
        if: matrix.arch == 'amd64'
        run: sh tests/install-in-container.sh build/out/mergerfs-snapraid_amd64.raw

      - name: Smoke-test mergerfs binary from the tarball in ${{ matrix.platform }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/build:/b" debian:bookworm-slim bash -c '
              set -e
              apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
              cd /tmp
              curl -fSL -o m.tgz \
                "https://github.com/trapexit/mergerfs/releases/download/${{ env.MERGERFS_VERSION }}/mergerfs-${{ env.MERGERFS_VERSION }}-static-linux_${{ matrix.arch }}.tar.gz"
              tar -xzf m.tgz
              ./usr/local/bin/mergerfs --version
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sysext-${{ matrix.arch }}
          path: |
            build/out/mergerfs-snapraid_${{ matrix.arch }}.raw
            build/out/SHA256SUMS

  # Config files nothing else reads in CI: a broken dependabot.yml makes Dependabot go
  # silent instead of failing anything. Tool version pinned.
  config-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dependabot.yml against the Dependabot schema
        run: pipx run check-jsonschema==0.38.2 --builtin-schema vendor.dependabot .github/dependabot.yml
      - name: actionlint + shellcheck (pinned releases, SHA256-checked)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar xzf "$f" actionlint
          s="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${s}"
          echo "${SHELLCHECK_SHA256}  ${s}" | sha256sum -c -
          tar xJf "$s" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          ./actionlint -version
          "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --version
          # explicit: without -shellcheck= the run: blocks are checked only if the
          # runner happens to have shellcheck on PATH (and the log does not say)
          ./actionlint -shellcheck="./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" .github/workflows/*.yml
          # the repo's own scripts with the same pinned shellcheck
          "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" -s sh -S warning \
              install.sh uninstall.sh scripts/*.sh build/*.sh tests/*.sh

  # Runs on every event (read-only): assembles exactly the files a release would get
  # and checks them, so artifact download/flatten breakage shows up in a PR, not only
  # at the next release.
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Install squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Flatten + merge SHA256SUMS, check every file
        run: |
          mkdir -p out
          find dist -name '*.raw' -exec cp {} out/ \;
          # Each matrix job wrote its own line; concatenate + de-dup into one file.
          find dist -name 'SHA256SUMS' -exec cat {} \; | sort -u > out/SHA256SUMS
          ls -l out
          cat out/SHA256SUMS
          [ "$(wc -l < out/SHA256SUMS)" = 2 ] || { echo "expected 2 checksum lines"; exit 1; }
          ( cd out && sha256sum -c SHA256SUMS )
          for a in amd64 arm64; do sh tests/check-raw.sh "out/mergerfs-snapraid_${a}.raw"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: out/

  publish:
    needs: assemble
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only this job may attach release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out
      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            out/mergerfs-snapraid_amd64.raw
            out/mergerfs-snapraid_arm64.raw
            out/SHA256SUMS
